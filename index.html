<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F0E6; --surface:#FFFFFF; --surface-2:#EAE6D6; --ink:#242318; --ink-soft:#5C594A;
  --line:#DBD5C0; --language:#8B3F66; --language-soft:#F2E3EC; --math:#2E6F5C; --math-soft:#E2EFE9;
  --gold:#9C7419; --good:#2E7D46; --good-soft:#E4F2E6; --bad:#B23B3B; --bad-soft:#FBE7E5; --chart:#3E5E8C;
  --shadow: 0 1px 2px rgba(36,35,24,.06), 0 6px 20px rgba(36,35,24,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191910; --surface:#221F16; --surface-2:#2B2717; --ink:#ECE6D4; --ink-soft:#B3AC94;
    --line:#3A3524; --language:#E48FBC; --language-soft:#3A2530; --math:#74D1B4; --math-soft:#1E332C;
    --gold:#E7BC5C; --good:#7ECC91; --good-soft:#203024; --bad:#E38A83; --bad-soft:#3A2320; --chart:#8FB0E0;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#191910; --surface:#221F16; --surface-2:#2B2717; --ink:#ECE6D4; --ink-soft:#B3AC94;
  --line:#3A3524; --language:#E48FBC; --language-soft:#3A2530; --math:#74D1B4; --math-soft:#1E332C;
  --gold:#E7BC5C; --good:#7ECC91; --good-soft:#203024; --bad:#E38A83; --bad-soft:#3A2320; --chart:#8FB0E0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Work Sans",system-ui,sans-serif;line-height:1.5;padding-inline:16px;}
h1,h2,h3,.display{font-family:"Fraunces",Georgia,serif;text-wrap:balance;letter-spacing:-0.01em;}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
button{font-family:inherit;cursor:pointer;}
button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--chart);outline-offset:2px;}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 48px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--language),var(--math));display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;}
.brand-name{font-family:"Fraunces",serif;font-size:20px;font-weight:600;}
.top-actions{display:flex;gap:8px;align-items:center;}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:9px;font-size:14px;font-weight:600;transition:transform .08s ease, background .15s;}
.btn:hover{background:var(--surface-2);}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.btn-primary:hover{opacity:.9;background:var(--ink);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;}
.pill-good{background:var(--good-soft);color:var(--good);}
.pill-gold{background:color-mix(in srgb, var(--gold) 18%, transparent);color:var(--gold);}
.pill-muted{background:var(--surface-2);color:var(--ink-soft);}
.pill-bad{background:var(--bad-soft);color:var(--bad);}

/* HOME */
.stat-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
.stat-chip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px;box-shadow:var(--shadow);}
.stat-chip .num{font-family:"IBM Plex Mono";font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;}
.stat-chip .lbl{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
.subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
.subject-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:12px;}
.subject-card:hover{border-color:var(--accent);}
.subject-card.la{--accent:var(--language);}
.subject-card.math{--accent:var(--math);}
.subject-card .tag{color:var(--accent);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;}
.subject-card h2{margin:2px 0 0;font-size:24px;}
.ring{width:52px;height:52px;border-radius:50%;flex:none;background:conic-gradient(var(--accent) calc(var(--pct)*1%), var(--surface-2) 0);display:flex;align-items:center;justify-content:center;}
.ring span{width:40px;height:40px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:"IBM Plex Mono";}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.areas-list{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink-soft);}
.areas-list b{color:var(--ink);}

/* SUBJECT / TRAIL */
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);margin-bottom:10px;}
.crumbs button{background:none;border:none;color:var(--ink-soft);font:inherit;padding:2px;text-decoration:underline;}
.subject-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.subject-head h1{margin:0;font-size:30px;}
.area-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.area-tab{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:13.5px;color:var(--ink-soft);}
.area-tab.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.trail-layout{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start;}
@media (max-width:760px){.trail-layout{grid-template-columns:1fr;}}
.trail{position:relative;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow);}
.node{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid transparent;background:none;text-align:left;width:100%;position:relative;}
.node:not(.locked):hover{background:var(--surface-2);}
.node.selected{background:var(--surface-2);border-color:var(--line);}
.node.locked{opacity:.5;cursor:not-allowed;}
.node .dot{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink-soft);}
.node.mastered .dot{background:var(--gold);color:#fff;}
.node.pending .dot{background:var(--chart);color:#fff;}
.node .info b{display:block;font-size:13.5px;}
.node .info small{color:var(--ink-soft);font-size:11.5px;}
.node .connector{position:absolute;left:24px;top:38px;width:2px;height:calc(100% - 4px);background:var(--line);z-index:0;}

.topic-panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow);}
.topic-panel h2{margin:0 0 6px;font-size:24px;}
.objective-box{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:14px;margin:14px 0 18px;border-left:3px solid var(--accent, var(--ink));}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
@media (max-width:520px){.mode-grid{grid-template-columns:1fr;}}
.mode-card{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;}
.mode-card h3{margin:0;font-size:15px;}
.mode-card p{margin:0;font-size:12.5px;color:var(--ink-soft);}
.history{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.history-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);border-bottom:1px dashed var(--line);padding:6px 0;}
.history-row b{color:var(--ink);}

/* QUIZ */
.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.progress-track{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:18px;}
.progress-fill{height:100%;background:var(--accent,var(--ink));border-radius:99px;transition:width .25s ease;}
.passage-box{background:var(--surface-2);border-radius:10px;padding:16px;font-size:14px;margin-bottom:18px;max-height:260px;overflow:auto;}
.passage-box h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
.question-text{font-size:18px;font-weight:600;margin:0 0 16px;font-family:"Fraunces",serif;text-wrap:balance;}
.choices{display:flex;flex-direction:column;gap:9px;margin-bottom:18px;}
.choice{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;text-align:left;font-size:14.5px;}
.choice:hover:not(:disabled){border-color:var(--accent,var(--ink));}
.choice .letter{width:22px;height:22px;border-radius:6px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:none;}
.choice.correct{background:var(--good-soft);border-color:var(--good);}
.choice.correct .letter{background:var(--good);color:#fff;}
.choice.incorrect{background:var(--bad-soft);border-color:var(--bad);}
.choice.incorrect .letter{background:var(--bad);color:#fff;}
.choice.picked-neutral{background:color-mix(in srgb, var(--accent, var(--ink)) 18%, var(--surface));border-color:var(--accent, var(--ink));box-shadow:inset 0 0 0 1px var(--accent, var(--ink));}
.choice.picked-neutral .letter{background:var(--accent, var(--ink));color:#fff;}
.choice:disabled{cursor:default;}
.choice:disabled:not(.picked-neutral):not(.correct):not(.incorrect){opacity:.5;}
.quiz-footer{display:flex;justify-content:space-between;align-items:center;}

.result-banner{border-radius:14px;padding:20px;margin-bottom:18px;display:flex;align-items:center;gap:16px;}
.result-banner.pass{background:var(--good-soft);}
.result-banner.fail{background:var(--bad-soft);}
.result-banner .score{font-family:"IBM Plex Mono";font-size:32px;font-weight:600;}
.review-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:13.5px;}
.review-item .q{font-weight:600;margin-bottom:4px;}
.review-item .ans{color:var(--ink-soft);}
.review-item.wrong{border-left:3px solid var(--bad);}
.review-item.right{border-left:3px solid var(--good);}

/* WRITING */
.rubric-list{display:flex;flex-direction:column;gap:8px;margin:14px 0 18px;}
.rubric-item{display:flex;align-items:flex-start;gap:9px;font-size:14px;}
.rubric-item input{margin-top:3px;}
textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:14.5px;background:var(--surface);color:var(--ink);resize:vertical;}
.char-count{font-size:12px;color:var(--ink-soft);text-align:right;margin-top:4px;}
.note-box{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13.5px;margin:10px 0;border-left:3px solid var(--chart);}

/* TEACHER */
.teacher-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px;}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:22px;}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:20px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
.bar-col .v{font-size:11px;color:var(--ink-soft);font-family:"IBM Plex Mono";}
.bar-col .bar{width:100%;max-width:34px;background:var(--chart);border-radius:5px 5px 3px 3px;min-height:3px;}
.bar-col .d{font-size:11px;color:var(--ink-soft);margin-top:2px;}
table.tt{width:100%;border-collapse:collapse;font-size:13.5px;}
table.tt th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:6px 10px;border-bottom:1px solid var(--line);}
table.tt td{padding:9px 10px;border-bottom:1px solid var(--line);}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:26px 0 10px;}
.submission-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
.submission-text{background:var(--surface-2);border-radius:8px;padding:12px;font-size:13.5px;white-space:pre-wrap;margin:10px 0;}
.overflow-x{overflow-x:auto;}

/* MODAL */
.modal-back{position:fixed;inset:0;background:rgba(20,19,12,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;}
.modal{background:var(--surface);border-radius:14px;padding:24px;max-width:340px;width:100%;box-shadow:var(--shadow);}
.modal input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;margin:10px 0;background:var(--bg);color:var(--ink);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
.empty-note{color:var(--ink-soft);font-size:13.5px;padding:14px;text-align:center;}
</style>
</head>

const PASS_PCT = 0.8;
const ATTEMPT_CAP = 20;
const SHEET_PROGRESS_SEED = {}; // no prior history for a brand-new site

/* ---------- Utilities ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function topicKey(subj,area,idx){ return subj+"-"+area+"-"+idx; }
function fmtPct(p){ return Math.round(p*100)+"%"; }
function fmtDur(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return m+":"+String(s).padStart(2,"0"); }
function fmtDate(ts){ const d=new Date(ts); return (d.getMonth()+1)+"/"+d.getDate(); }
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function defaultProgress(){ return { status:"available", bestPct:0, attempts:[], writingText:"", teacherNote:"", revisionRequested:false }; }

/* ---------- Store (local to this device — no login required) ---------- */
const LOCAL_KEY = "studyTrailData_val_v1";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/1DW9Y2Ch7PPSZMKlaWDj_LEFoPTlo4EPWaHs973LYOXo/edit";
const SAVE_URL = "https://script.google.com/macros/s/AKfycbxYDrZrphfd8RT3G6ZqrdIh1o37lfgT7pI8YutAjVQoNFNBcU_25zme725ShybXp38y/exec";
let progressData = {};
let settings = { pin:"1234" };

function loadLocal(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    if(raw){ const parsed = JSON.parse(raw); progressData = parsed.progress||{}; settings = Object.assign({pin:"1234"}, parsed.settings||{}); }
    else { progressData = JSON.parse(JSON.stringify(SHEET_PROGRESS_SEED)); saveLocal(); }
  }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify({progress:progressData, settings})); }catch(e){}
}

async function initStore(){
  loadLocal();
  render();
}

function getProgress(key){ return progressData[key] || defaultProgress(); }

async function persistProgress(key, data){
  progressData[key] = data;
  saveLocal();
  render();
}

async function persistSettings(newSettings){
  settings = Object.assign({}, settings, newSettings);
  saveLocal();
  render();
}

/* ---------- Copy a row for the shared Google Sheet (manual backup) ---------- */
function sanitizeCell(s){ return String(s==null?"":s).replace(/[\t\r\n]+/g," ").trim(); }
function rowFields(subj, area, topic, mode, score, minutes, status, notes){
  const d = new Date();
  return {
    date: (d.getMonth()+1)+"/"+d.getDate()+"/"+d.getFullYear(),
    subject: CURRICULUM[subj].name, area: CURRICULUM[subj].areas[area].name,
    topic: topic, mode: mode, score: sanitizeCell(score), minutes: minutes,
    status: status, notes: sanitizeCell(notes)
  };
}
function buildRow(subj, area, topic, mode, score, minutes, status, notes){
  const f = rowFields(subj, area, topic, mode, score, minutes, status, notes);
  return [f.date, f.subject, f.area, f.topic, f.mode, f.score, f.minutes, f.status, f.notes].join("\t");
}
/* ---------- Automatic save via a Google Apps Script Web App (no login needed) ---------- */
function sendRowAutomatically(fields, btn){
  if(!SAVE_URL){ alert("Auto-save isn't set up yet for this site -- use \"Copy Row instead\" and paste it into the Progress Sheet."); return; }
  const old = btn ? btn.textContent : null;
  if(btn){ btn.textContent = "Saving…"; btn.disabled = true; }
  fetch(SAVE_URL, { method:"POST", mode:"no-cors", body: JSON.stringify(fields) })
    .then(function(){
      if(btn){ btn.textContent = "Saved ✓"; }
    })
    .catch(function(){
      if(btn){ btn.textContent = old; btn.disabled = false; }
      alert("Couldn't reach the save link — check your internet connection, or use \"Copy Row for Sheet\" instead.");
    });
}
function copyText(text, btn){
  const done = function(){ if(btn){ const old = btn.textContent; btn.textContent="Copied!"; setTimeout(function(){ btn.textContent = old==="Copied!" ? "Copy row for Sheet" : old; },1500); } };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
}
function fallbackCopy(text){
  try{
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
  }catch(e){}
}


/* ---------- Curriculum helpers ---------- */
function getTopics(subj,area){ return CURRICULUM[subj].areas[area].topics; }
function isUnlocked(subj,area,idx){
  if(idx===0) return true;
  const prevKey = topicKey(subj,area,idx-1);
  return getProgress(prevKey).status === "mastered";
}
function subjectAccentVar(subj){ return subj==="la" ? "var(--language)" : "var(--math)"; }
function subjectProgressPct(subj){
  let total=0, mastered=0;
  Object.keys(CURRICULUM[subj].areas).forEach(function(area){
    getTopics(subj,area).forEach(function(t,idx){
      total++; if(getProgress(topicKey(subj,area,idx)).status==="mastered") mastered++;
    });
  });
  return total ? Math.round((mastered/total)*100) : 0;
}
function allAttempts(){
  const list=[];
  Object.keys(progressData).forEach(function(key){
    (progressData[key].attempts||[]).forEach(function(a){ list.push(Object.assign({key:key}, a)); });
  });
  return list;
}
function weeklyMinutes(){
  const days=[]; const now=new Date();
  for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); days.push(d); }
  const byDay = {};
  allAttempts().forEach(function(a){ const k=dayKey(a.ts); byDay[k]=(byDay[k]||0)+ (a.durationSec||0); });
  return days.map(function(d){ return { label:["S","M","T","W","T","F","S"][d.getDay()], mins: Math.round((byDay[d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()]||0)/60) }; });
}
function currentStreak(){
  const now=new Date(); let streak=0;
  const daysWithActivity = new Set(allAttempts().map(function(a){ return dayKey(a.ts); }));
  for(let i=0;i<365;i++){
    const d=new Date(now); d.setDate(now.getDate()-i);
    const k=d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();
    if(daysWithActivity.has(k)) streak++; else break;
  }
  return streak;
}

/* ---------- App state ---------- */
let state = { screen:"home", subj:null, area:null, idx:null, quiz:null, teacherAuthed:false, expandedSub:null };

function go(screen, extra){ state = Object.assign({screen:screen}, extra||{}); render(); window.scrollTo(0,0); }

/* ---------- Quiz flow ---------- */
function startQuiz(subj,area,idx,mode){
  const topic = getTopics(subj,area)[idx];
  const qs = mode==="practice" ? topic.p : topic.a;
  state = { screen:"quiz", subj:subj, area:area, idx:idx, quiz:{
    mode:mode, questions:qs, qi:0, answers:new Array(qs.length).fill(null), picked:null, startTime:Date.now()
  }};
  render();
}
function pickChoice(ci){
  if(state.quiz.picked!==null) return;
  state.quiz.picked = ci;
  state.quiz.answers[state.quiz.qi] = ci;
  render();
}
function nextQuestion(){
  const quiz = state.quiz;
  if(quiz.qi < quiz.questions.length-1){ quiz.qi++; quiz.picked=null; render(); }
  else finishQuiz();
}
function finishQuiz(){
  const quiz = state.quiz;
  const durationSec = Math.min(2700,(Date.now()-quiz.startTime)/1000);
  let correct=0;
  quiz.questions.forEach(function(q,i){ if(quiz.answers[i]===q[2]) correct++; });
  const pct = correct/quiz.questions.length;
  const key = topicKey(state.subj,state.area,state.idx);
  const prog = Object.assign(defaultProgress(), getProgress(key));
  const attempts = (prog.attempts||[]).concat([{mode:quiz.mode, correct:correct, total:quiz.questions.length, pct:pct, durationSec:durationSec, ts:Date.now()}]).slice(-ATTEMPT_CAP);
  const newStatus = quiz.mode==="assessment" ? (pct>=PASS_PCT ? "mastered" : (prog.status==="mastered"?"mastered":"available")) : prog.status;
  const bestPct = quiz.mode==="assessment" ? Math.max(prog.bestPct||0, pct) : prog.bestPct;
  state.screen="results"; state.result = {correct:correct,total:quiz.questions.length,pct:pct,mode:quiz.mode,questions:quiz.questions,answers:quiz.answers.slice(),passed:pct>=PASS_PCT,durationSec:durationSec};
  persistProgress(key, Object.assign({}, prog, {status:newStatus, bestPct:bestPct, attempts:attempts}));
}

/* ---------- Writing flow ---------- */
function startWriting(subj,area,idx){
  state = { screen:"writing", subj:subj, area:area, idx:idx, startTime:Date.now(), checks:[false,false,false,false,false], text:"" };
  render();
}
function submitWriting(){
  const key = topicKey(state.subj,state.area,state.idx);
  const prog = Object.assign(defaultProgress(), getProgress(key));
  const durationSec = Math.min(2700,(Date.now()-state.startTime)/1000);
  const attempts = (prog.attempts||[]).concat([{mode:"writing", durationSec:durationSec, ts:Date.now()}]).slice(-ATTEMPT_CAP);
  persistProgress(key, Object.assign({}, prog, {status:"pending_review", writingText:state.text, attempts:attempts, revisionRequested:false}));
  go("topic", {subj:state.subj, area:state.area, idx:state.idx});
}

/* ---------- Teacher actions ---------- */
function teacherDecide(key, decision, note){
  const prog = Object.assign(defaultProgress(), getProgress(key));
  if(decision==="approve"){
    persistProgress(key, Object.assign({}, prog, {status:"mastered", teacherNote:note||""}));
  } else {
    persistProgress(key, Object.assign({}, prog, {status:"available", revisionRequested:true, teacherNote:note||""}));
  }
}
function teacherReset(key){
  persistProgress(key, defaultProgress());
}

/* ---------- Rendering ---------- */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = topbarHtml() + bodyHtml();
  wireEvents();
}

function topbarHtml(){
  return '<div class="topbar">'
    + '<div class="brand"><div class="mark">🧭</div><div class="brand-name">Study Trail</div></div>'
    + '<div class="top-actions">'
    + '<a class="btn btn-ghost" href="'+SHEET_URL+'" target="_blank" rel="noopener">Progress Sheet ↗</a>'

        ? '<button class="btn" data-act="home">Student View</button>'
        : '<button class="btn" data-act="teacher-login">Teacher Dashboard</button>')
    + '</div></div>';
}

function bodyHtml(){
  switch(state.screen){
    case "home": return homeHtml();
    case "subject": return subjectHtml();

    case "quiz": return quizHtml();
    case "results": return resultsHtml();

function homeHtml(){
  const wk = weeklyMinutes().reduce(function(a,b){return a+b.mins;},0);
  const streak = currentStreak();
  let html = '<div class="stat-strip">'
    + statChip(wk+" min", "This week")
    + statChip(streak, "Day streak")
    + statChip(fmtPct(subjectProgressPct("la")/100), "Language Arts")
    + statChip(fmtPct(subjectProgressPct("math")/100), "Pre-Algebra")
    + '</div>';
  html += '<div class="subject-grid">';
  html += subjectCard("la");
  html += subjectCard("math");
  html += '</div>';
  return html;
}
function statChip(num,lbl){ return '<div class="stat-chip"><div class="num mono">'+esc(num)+'</div><div class="lbl">'+esc(lbl)+'</div></div>'; }

function subjectCard(subj){
  const cur = CURRICULUM[subj];
  const pct = subjectProgressPct(subj);
  const cls = subj==="la" ? "la" : "math";
  let areasHtml = Object.keys(cur.areas).map(function(a){
    const topics = getTopics(subj,a);
    const mastered = topics.filter(function(t,i){ return getProgress(topicKey(subj,a,i)).status==="mastered"; }).length;
    return '<div><b>'+esc(cur.areas[a].name)+':</b> '+mastered+' / '+topics.length+' topics mastered</div>';
  }).join("");
  return '<button class="subject-card '+cls+'" data-act="open-subject" data-subj="'+subj+'">'
    + '<div class="card-top"><div><div class="tag">'+ (subj==="la"?"Language Arts":"Math") +'</div><h2 class="display">'+esc(cur.name)+'</h2></div>'
    + '<div class="ring" style="--pct:'+pct+'"><span class="mono">'+pct+'%</span></div></div>'
    + '<div class="areas-list">'+areasHtml+'</div>'
    + '</button>';
}

function subjectHtml(){
  const subj = state.subj;
  const cur = CURRICULUM[subj];
  const areaKeys = Object.keys(cur.areas);
  const area = state.area || areaKeys[0];
  const topics = getTopics(subj,area);
  const accent = subjectAccentVar(subj);

  let tabs = areaKeys.map(function(a){
    return '<button class="area-tab '+(a===area?"active":"")+'" data-act="open-area" data-subj="'+subj+'" data-area="'+a+'">'+esc(cur.areas[a].name)+'</button>';
  }).join("");

  let nodes = topics.map(function(t,i){
    const key = topicKey(subj,area,i);
    const prog = getProgress(key);
    const unlocked = isUnlocked(subj,area,i);
    const selected = state.idx===i && state.area===area;
    let statusCls = prog.status==="mastered" ? "mastered" : (prog.status==="pending_review" ? "pending" : "");
    let dot = prog.status==="mastered" ? "★" : (prog.status==="pending_review" ? "…" : (unlocked ? (i+1) : "🔒"));
    return '<div style="position:relative">'
      + (i<topics.length-1 ? '<div class="connector"></div>' : '')
      + '<button class="node '+statusCls+' '+(selected?"selected":"")+' '+(unlocked?"":"locked")+'" '
      + (unlocked ? 'data-act="open-topic" data-subj="'+subj+'" data-area="'+area+'" data-idx="'+i+'"' : 'disabled')
      + '><div class="dot">'+dot+'</div><div class="info"><b>'+esc(t.t)+'</b><small>'+(prog.status==="mastered"?"Mastered · "+fmtPct(prog.bestPct):prog.status==="pending_review"?"Awaiting review":unlocked?"Ready":"Locked")+'</small></div></button>'
      + '</div>';
  }).join("");

  let panel = "";
  if(state.idx!=null && state.area===area) panel = topicPanelHtml(subj,area,state.idx);
  else panel = '<div class="topic-panel"><p class="empty-note">Choose a topic on the left to see its objective and start practicing.</p></div>';

  return '<div class="crumbs"><button data-act="home">Subjects</button> / '+esc(cur.name)+'</div>'
    + '<div class="subject-head"><h1 class="display">'+esc(cur.name)+'</h1></div>'
    + '<div class="area-tabs">'+tabs+'</div>'
    + '<div class="trail-layout" style="--accent:'+accent+'">'
    + '<div class="trail">'+nodes+'</div>'
    + '<div>'+panel+'</div>'
    + '</div>';
}

function topicPanelHtml(subj,area,idx){
  const topic = getTopics(subj,area)[idx];
  const key = topicKey(subj,area,idx);
  const prog = getProgress(key);
  const accent = subjectAccentVar(subj);
  let body = '<div class="topic-panel" style="--accent:'+accent+'">';
  body += '<h2 class="display">'+esc(topic.t)+'</h2>';
  body += '<div class="objective-box" style="--accent:'+accent+'"><b>Learning objective:</b> '+esc(topic.o)+'</div>';

  if(topic.type==="writing"){
    if(prog.status==="pending_review"){
      const lastAttempt = (prog.attempts||[]).slice(-1)[0]||{};
      const mins = Math.round((lastAttempt.durationSec||0)/60);
      const fields = rowFields(subj, area, topic.t, "Writing", "—", mins, "Awaiting review", prog.writingText);
      const row = buildRow(subj, area, topic.t, "Writing", "—", mins, "Awaiting review", prog.writingText);
      body += '<p class="pill pill-gold">Submitted — waiting for teacher feedback</p>';
      body += '<div class="submission-text">'+esc(prog.writingText)+'</div>';
      body += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'
        + '<button class="btn btn-primary" data-act="save-row" data-fields="'+esc(JSON.stringify(fields))+'">💾 Save My Paragraph</button>'
        + '<button class="btn btn-sm btn-ghost" data-act="copy-row" data-row="'+esc(row)+'">Copy Row instead</button>'
        + '</div>';
      body += '<p style="font-size:12px;color:var(--ink-soft);margin-top:8px">One tap saves this (her paragraph included) straight to the <a href="'+SHEET_URL+'" target="_blank" rel="noopener">Progress Sheet</a> so your teacher can read and grade it.</p>';
    } else if(prog.status==="mastered"){
      body += '<p class="pill pill-good">Mastered</p>';
      if(prog.teacherNote) body += '<div class="note-box"><b>Teacher note:</b> '+esc(prog.teacherNote)+'</div>';
      body += '<div class="submission-text">'+esc(prog.writingText)+'</div>';
    } else {
      if(prog.revisionRequested){
        body += '<div class="note-box"><b>Your teacher asked for a revision:</b> '+esc(prog.teacherNote||"Please try again.")+'</div>';
      }
      body += '<button class="btn btn-primary" data-act="start-writing" data-subj="'+subj+'" data-area="'+area+'" data-idx="'+idx+'">Open Writing Task</button>';
    }
  } else {
    body += '<div class="mode-grid">'
      + '<div class="mode-card"><h3>Practice</h3><p>Untimed, retry anytime. Answers revealed right away.</p><button class="btn" data-act="start-quiz" data-subj="'+subj+'" data-area="'+area+'" data-idx="'+idx+'" data-mode="practice">Start Practice ('+topic.p.length+' Qs)</button></div>'
      + '<div class="mode-card"><h3>Assessment</h3><p>Score '+Math.round(PASS_PCT*100)+'%+ to master this topic and unlock the next.</p><button class="btn btn-primary" data-act="start-quiz" data-subj="'+subj+'" data-area="'+area+'" data-idx="'+idx+'" data-mode="assessment">Start Assessment ('+topic.a.length+' Qs)</button></div>'
      + '</div>';
    if(prog.bestPct) body += '<p class="pill '+(prog.status==="mastered"?"pill-good":"pill-muted")+'">Best assessment score: '+fmtPct(prog.bestPct)+(prog.status==="mastered"?" — Mastered":"")+'</p>';
    if(prog.attempts && prog.attempts.length){

        return '<div class="history-row"><span>'+esc(a.mode)+' · '+fmtDate(a.ts)+'</span><b>'+(a.mode==="writing"?fmtDur(a.durationSec):a.correct+'/'+a.total+' ('+fmtPct(a.pct)+') · '+fmtDur(a.durationSec))+'</b></div>';
      }).join("")+'</div>';
    }
  }
  body += '</div>';
  return body;
}

function quizHtml(){
  const quiz = state.quiz;
  const topic = getTopics(state.subj,state.area)[state.idx];
  const accent = subjectAccentVar(state.subj);
  const q = quiz.questions[quiz.qi];
  const passage = quiz.mode==="practice" ? topic.passageP : topic.passageA;
  const pctDone = Math.round((quiz.qi)/quiz.questions.length*100);
  let html = '<div style="--accent:'+accent+'">';
  html += '<div class="quiz-head"><div><b>'+esc(topic.t)+'</b> <span class="pill pill-muted">'+(quiz.mode==="practice"?"Practice":"Assessment")+'</span></div><div class="mono" style="font-size:13px;color:var(--ink-soft)">Question '+(quiz.qi+1)+' of '+quiz.questions.length+'</div></div>';
  html += '<div class="progress-track"><div class="progress-fill" style="width:'+pctDone+'%"></div></div>';
  if(passage) html += '<div class="passage-box"><h4>Passage</h4>'+esc(passage).replace(/\n/g,"<br><br>")+'</div>';
  html += '<div class="question-text">'+esc(q[0])+'</div>';
  html += '<div class="choices">'+q[1].map(function(choiceText,ci){
    let cls = "";
    if(quiz.mode==="practice" && quiz.picked!==null){
      if(ci===q[2]) cls="correct";
      else if(ci===quiz.picked) cls="incorrect";
    } else if(quiz.picked===ci){ cls="picked-neutral"; }
    return '<button class="choice '+cls+'" '+(quiz.picked!==null ? "disabled" : "")+' data-act="pick" data-ci="'+ci+'"><span class="letter">'+"ABCD"[ci]+'</span>'+esc(choiceText)+'</button>';
  }).join("")+'</div>';
  html += '<div class="quiz-footer"><button class="btn btn-ghost" data-act="open-topic" data-subj="'+state.subj+'" data-area="'+state.area+'" data-idx="'+state.idx+'">Exit</button>';
  if(quiz.mode==="assessment"){
    html += '<button class="btn btn-primary" data-act="next-q" '+(quiz.picked===null?"disabled":"")+'>'+(quiz.qi<quiz.questions.length-1?"Next":"Submit Assessment")+'</button>';
  } else {
    html += '<button class="btn btn-primary" data-act="next-q" '+(quiz.picked===null?"disabled":"")+'>'+(quiz.qi<quiz.questions.length-1?"Continue":"Finish Practice")+'</button>';
  }
  html += '</div></div>';
  return html;
}

function resultsHtml(){
  const r = state.result;
  const topic = getTopics(state.subj,state.area)[state.idx];
  const accent = subjectAccentVar(state.subj);
  const minutes = Math.round((r.durationSec||0)/60);
  let html = '<div style="--accent:'+accent+'">';
  html += '<div class="result-banner '+(r.passed?"pass":"fail")+'"><div class="score mono">'+r.correct+'/'+r.total+'</div><div><b>'+(r.mode==="assessment"?(r.passed?"Topic mastered! 🎉 Next topic unlocked.":"Not quite — "+Math.round(PASS_PCT*100)+"% needed to master this topic."):"Practice complete.")+'</b><div style="color:var(--ink-soft);font-size:13px">Score: '+fmtPct(r.pct)+'</div></div></div>';
  html += '<h3 style="margin-top:4px">Review answers</h3>';
  html += r.questions.map(function(q,i){
    const right = r.answers[i]===q[2];
    return '<div class="review-item '+(right?"right":"wrong")+'"><div class="q">'+esc(q[0])+'</div><div class="ans">Your answer: '+esc(q[1][r.answers[i]]!=null?q[1][r.answers[i]]:"—")+(right?"":" · Correct answer: "+esc(q[1][q[2]]))+'</div></div>';
  }).join("");
  const scoreLabel = r.correct+"/"+r.total+" ("+fmtPct(r.pct)+")";
  const statusLabel = r.mode==="assessment"?(r.passed?"Mastered":"Not yet"):"—";
  const fields = rowFields(state.subj, state.area, topic.t, r.mode==="practice"?"Practice":"Assessment", scoreLabel, minutes, statusLabel, "");
  const row = buildRow(state.subj, state.area, topic.t, r.mode==="practice"?"Practice":"Assessment", scoreLabel, minutes, statusLabel, "");
  html += '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
    + '<button class="btn btn-primary" data-act="save-row" data-fields="'+esc(JSON.stringify(fields))+'">💾 Save My Results</button>'
    + '<button class="btn btn-sm btn-ghost" data-act="copy-row" data-row="'+esc(row)+'">Copy Row instead</button>'
    + '<button class="btn btn-ghost" data-act="open-topic" data-subj="'+state.subj+'" data-area="'+state.area+'" data-idx="'+state.idx+'">Back to Topic</button>'
    + '</div>';
  html += '<p style="font-size:12px;color:var(--ink-soft);margin-top:8px">One tap saves this straight to the <a href="'+SHEET_URL+'" target="_blank" rel="noopener">Progress Sheet</a> — no copying needed.</p>';
  html += '</div>';
  return html;
}

function writingHtml(){
  const topic = getTopics(state.subj,state.area)[state.idx];
  const accent = subjectAccentVar(state.subj);
  const allChecked = state.checks.every(Boolean);
  const longEnough = state.text.trim().length > 40;
  let html = '<div class="topic-panel" style="--accent:'+accent+'">';
  html += '<h2 class="display">'+esc(topic.t)+'</h2>';
  html += '<div class="objective-box"><b>Prompt:</b> '+esc(topic.prompt)+'</div>';
  html += '<textarea id="writingText" placeholder="Write your paragraph here...">'+esc(state.text)+'</textarea>';
  html += '<div class="char-count">'+state.text.trim().length+' characters</div>';
  html += '<div class="rubric-list">'+topic.rubric.map(function(item,i){
    return '<label class="rubric-item"><input type="checkbox" data-act="check" data-i="'+i+'" '+(state.checks[i]?"checked":"")+'> '+esc(item)+'</label>';
  }).join("")+'</div>';
  html += '<div class="quiz-footer"><button class="btn btn-ghost" data-act="open-topic" data-subj="'+state.subj+'" data-area="'+state.area+'" data-idx="'+state.idx+'">Cancel</button>'
    + '<button class="btn btn-primary" data-act="submit-writing" '+((allChecked && longEnough)?"":"disabled")+'>Submit for Review</button></div>';
  html += '</div>';
  return html;
}

function pinModalHtml(){
  return '<div class="modal-back" data-act="close-modal"><div class="modal" onclick="event.stopPropagation()">'
    + '<h3 class="display" style="margin-top:0">Teacher Dashboard</h3>'
    + '<p style="font-size:13.5px;color:var(--ink-soft);margin:0">Enter the teacher PIN to view progress and grade writing tasks.</p>'
    + '<input type="password" id="pinInput" placeholder="PIN" inputmode="numeric">'
    + '<div id="pinError" style="color:var(--bad);font-size:12.5px;min-height:16px"></div>'
    + '<div class="modal-actions"><button class="btn" data-act="close-modal">Cancel</button><button class="btn btn-primary" data-act="pin-submit">Enter</button></div>'
    + '</div></div>';
}

function teacherHtml(){
  const wk = weeklyMinutes();
  const maxMin = Math.max(1, Math.max.apply(null, wk.map(function(d){return d.mins;})));
  let html = '<div class="crumbs"><button data-act="home">Student View</button> / Teacher Dashboard</div>';
  html += '<h1 class="display" style="margin-top:0">Teacher Dashboard</h1>';

  html += '<div class="teacher-grid">'
    + statChip(currentStreak(), "Day streak")
    + statChip(wk.reduce(function(a,b){return a+b.mins;},0)+" min", "Last 7 days")
    + statChip(fmtPct(subjectProgressPct("la")/100), "Language Arts done")
    + statChip(fmtPct(subjectProgressPct("math")/100), "Pre-Algebra done")
    + '</div>';

  html += '<div class="chart-card"><h3 style="margin:0 0 4px">Practice time, last 7 days</h3>'
    + '<div class="bars">'+wk.map(function(d){
      const h = Math.round((d.mins/maxMin)*90)+6;
      return '<div class="bar-col"><div class="v mono">'+d.mins+'</div><div class="bar" style="height:'+h+'px" title="'+d.mins+' minutes"></div><div class="d">'+d.label+'</div></div>';
    }).join("")+'</div></div>';

  ["la","math"].forEach(function(subj){
    const cur = CURRICULUM[subj];
    html += '<div class="section-title">'+esc(cur.name)+'</div>';
    Object.keys(cur.areas).forEach(function(area){
      html += '<div style="margin-bottom:18px"><b style="font-size:14px">'+esc(cur.areas[area].name)+'</b><div class="overflow-x"><table class="tt"><thead><tr><th>Topic</th><th>Status</th><th>Best score</th><th>Attempts</th><th>Last activity</th><th></th></tr></thead><tbody>';
      getTopics(subj,area).forEach(function(t,i){
        const key = topicKey(subj,area,i);
        const prog = getProgress(key);
        const unlocked = isUnlocked(subj,area,i);
        const statusPill = prog.status==="mastered" ? '<span class="pill pill-good">Mastered</span>' : prog.status==="pending_review" ? '<span class="pill pill-gold">Needs review</span>' : unlocked ? '<span class="pill pill-muted">In progress</span>' : '<span class="pill pill-muted">Locked</span>';
        const last = (prog.attempts&&prog.attempts.length) ? fmtDate(prog.attempts[prog.attempts.length-1].ts) : "—";
        html += '<tr><td>'+esc(t.t)+'</td><td>'+statusPill+'</td><td class="mono">'+(prog.bestPct?fmtPct(prog.bestPct):"—")+'</td><td class="mono">'+(prog.attempts?prog.attempts.length:0)+'</td><td class="mono">'+last+'</td><td><button class="btn btn-sm" data-act="teacher-reset" data-key="'+key+'">Reset</button></td></tr>';
      });
      html += '</tbody></table></div></div>';
    });
  });

  const pending = Object.keys(progressData).filter(function(k){ return progressData[k].status==="pending_review"; });
  html += '<div class="section-title">Writing submissions awaiting review</div>';
  if(!pending.length) html += '<p class="empty-note">Nothing waiting for review right now.</p>';
  pending.forEach(function(key){
    const prog = progressData[key];
    const parts = key.split("-");
    const topic = getTopics(parts[0],parts[1])[Number(parts[2])];
    html += '<div class="submission-card"><b>'+esc(topic.t)+'</b> <span style="color:var(--ink-soft);font-size:12.5px">'+esc(CURRICULUM[parts[0]].name)+'</span>'
      + '<div class="submission-text">'+esc(prog.writingText)+'</div>'
      + '<textarea id="note-'+key+'" placeholder="Feedback note (optional)" style="min-height:60px">'+esc(prog.teacherNote||"")+'</textarea>'
      + '<div class="modal-actions" style="justify-content:flex-start;margin-top:8px">'
      + '<button class="btn btn-primary" data-act="teacher-decide" data-key="'+key+'" data-decision="approve">Approve — Mastered</button>'
      + '<button class="btn" data-act="teacher-decide" data-key="'+key+'" data-decision="revise">Ask for Revision</button>'
      + '</div></div>';
  });

  html += '<div class="section-title">Settings</div>';
  html += '<button class="btn" data-act="change-pin">Change Teacher PIN</button>';
  html += '<p style="font-size:12px;color:var(--ink-soft);margin-top:10px">"Save My Results" writes straight to the <a href="'+SHEET_URL+'" target="_blank" rel="noopener">Progress Sheet</a> automatically — this works out of the box on any device, no setup needed. The "Copy Row" button remains as a manual backup if the save link is ever unreachable.</p>';
  return html;
}

/* ---------- Event wiring ---------- */
function wireEvents(){
  document.querySelectorAll("[data-act]").forEach(function(el){
    el.addEventListener("click", function(ev){
      const act = el.getAttribute("data-act");
      if(act==="home") go("home");
      else if(act==="open-subject") go("subject",{subj:el.dataset.subj, area:null, idx:null});
      else if(act==="open-area") go("subject",{subj:el.dataset.subj, area:el.dataset.area, idx:null});
      else if(act==="open-topic") go("topic",{subj:el.dataset.subj, area:el.dataset.area, idx:Number(el.dataset.idx)});
      else if(act==="start-quiz") startQuiz(el.dataset.subj, el.dataset.area, Number(el.dataset.idx), el.dataset.mode);
      else if(act==="start-writing") startWriting(el.dataset.subj, el.dataset.area, Number(el.dataset.idx));
      else if(act==="pick") pickChoice(Number(el.dataset.ci));
      else if(act==="next-q") nextQuestion();
      else if(act==="submit-writing") submitWriting();
      else if(act==="check"){ state.checks[Number(el.dataset.i)] = !state.checks[Number(el.dataset.i)]; render(); }
      else if(act==="copy-row" || act==="copy-summary"){ copyText(el.dataset.row, el); }
      else if(act==="save-row"){
        try{ sendRowAutomatically(JSON.parse(el.dataset.fields), el); }catch(e){}
      }
      else if(act==="teacher-login") go("teacher-login",{subj:state.subj,area:state.area,idx:state.idx});
      else if(act==="close-modal") go("home");
      else if(act==="pin-submit"){
        const val = document.getElementById("pinInput").value;
        if(val === (settings.pin||"1234")){ state.teacherAuthed = true; go("teacher"); }
        else { document.getElementById("pinError").textContent = "Incorrect PIN. Try again."; }
      }
      else if(act==="teacher-decide"){
        const note = document.getElementById("note-"+el.dataset.key).value;
        teacherDecide(el.dataset.key, el.dataset.decision, note);
      }
      else if(act==="teacher-reset"){
        if(confirm("Reset this topic's progress? This clears its status and history.")) teacherReset(el.dataset.key);
      }
      else if(act==="change-pin"){
        const np = prompt("Enter a new teacher PIN (numbers only):");
        if(np && /^[0-9]{3,8}$/.test(np)) persistSettings({pin:np});
        else if(np) alert("PIN must be 3-8 digits.");
      }
    });
  });
  const ta = document.getElementById("writingText");
  if(ta){ ta.addEventListener("input", function(){ state.text = ta.value; const cc=document.querySelector(".char-count"); if(cc) cc.textContent = state.text.trim().length+" characters"; document.querySelector('[data-act="submit-writing"]').disabled = !(state.checks.every(Boolean) && state.text.trim().length>40); }); }
}

initStore();
})();
</script>
